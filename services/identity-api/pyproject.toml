[project]
name = "identity-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.7",
    "asyncpg>=0.30",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    # Sync driver for Alembic; the app itself uses asyncpg.
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["identity_api*"]

[tool.setuptools.package-data]
"identity_api.migrations" = ["script.py.mako"]

[tool.ruff]
extend = "../ruff.toml"

[tool.mypy]
strict = true
files = ["identity_api", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
