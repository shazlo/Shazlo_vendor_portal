name: services-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "packages/py-auth/**"
      - ".github/workflows/services-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/**"
      - "packages/py-auth/**"
      - ".github/workflows/services-ci.yml"

concurrency:
  group: services-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # A change to shared config or this workflow runs every service. A service that uses
          # packages/py-auth lists it here, so changing the package runs that service too.
          filters: |
            py-auth:
              - "packages/py-auth/**"
              - "services/ruff.toml"
              - ".github/workflows/services-ci.yml"
            identity-api:
              - "services/identity-api/**"
              - "packages/py-auth/**"
              - "services/ruff.toml"
              - ".github/workflows/services-ci.yml"
            vendor-api:
              - "services/vendor-api/**"
              - "services/ruff.toml"
              - ".github/workflows/services-ci.yml"

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shazlo
          POSTGRES_PASSWORD: shazlo
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shazlo -d test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # identity-api's end-to-end test needs a real Redis. It empties database 1, never 0.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shazlo:shazlo@localhost:5432/test
      REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service == 'py-auth' && 'packages/py-auth' || format('services/{0}', matrix.service) }}/pyproject.toml
      # The shared package is a path dependency: install it first, so the service's own install
      # finds it. `compat` editable mode keeps it visible to mypy.
      - if: matrix.service != 'py-auth'
        run: |
          if grep -q shazlo-auth pyproject.toml; then
            pip install -e '../../packages/py-auth[fastapi]' --config-settings editable_mode=compat
          fi
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
